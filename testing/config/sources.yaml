sources:
  waze:
    enabled: true
    label: "WAZE"
    sd_type_uid: "WAZE_JAM_LOCATION"
    sd_type_label: "Waze Jam Location"
    instance_count: 10000
    identifier_prefix: "WAZE_JAM"
    profiles:
      normal:
        events_per_second: 9
        change_probability: 0.30
      high:
        events_per_second: 20
        change_probability: 0.45
      stress:
        events_per_second: 45
        change_probability: 0.70
    parameters:
      tags:
        - denotation: "country"
          label: "Country"
          type: "string"
        - denotation: "city"
          label: "City"
          type: "string"
        - denotation: "street"
          label: "Street"
          type: "string"
        - denotation: "segmentId"
          label: "Segment ID"
          type: "string"
        - denotation: "fromNode"
          label: "From Node"
          type: "string"
        - denotation: "toNode"
          label: "To Node"
          type: "string"
        - denotation: "isForward"
          label: "Is Forward"
          type: "string"
      fields:
        - denotation: "roadType"
          label: "Road Type"
          type: "string"
        - denotation: "delay"
          label: "Delay"
          type: "number"
        - denotation: "length"
          label: "Length"
          type: "number"
        - denotation: "level"
          label: "Level"
          type: "number"
        - denotation: "speed"
          label: "Speed"
