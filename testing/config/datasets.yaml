# @file datasets.yaml
# @brief Konfigurace velikostí a profilů syntetických datových sad.
#
# @author Vojtěch Hubáček
#
# @par Autorský podíl
# - Vojtěch Hubáček: návrh a implementace celé funkcionality souboru.
#
# @ingroup riot_testing

datasets:
  - id: "D0"
    label: "Sanity dataset"
    history_duration_hours: 1
    sources: ["waze", "ndic", "mhd"]
    build_mode: "fresh"
    load_profile: "normal"
    purpose: "quick validation"

  - id: "D1"
    label: "1 day dataset"
    history_duration_hours: 24
    sources: ["waze", "ndic", "mhd"]
    build_mode: "incremental"
    load_profile: "normal"
    purpose: "small benchmark"

  - id: "D2"
    label: "1 week dataset"
    history_duration_hours: 168
    sources: ["waze", "ndic", "mhd"]
    build_mode: "incremental"
    load_profile: "normal"
    purpose: "main benchmark"

  - id: "D3"
    label: "1 month dataset"
    history_duration_hours: 720
    sources: ["waze", "ndic", "mhd"]
    build_mode: "incremental"
    load_profile: "normal"
    purpose: "large benchmark"

  - id: "D4"
    label: "Extended dataset"
    history_duration_hours: 1440
    sources: ["waze", "ndic", "mhd"]
    build_mode: "synthetic_extension"
    load_profile: "high"
    purpose: "optional scale-out benchmark"
