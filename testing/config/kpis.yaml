# @file kpis.yaml
# @brief Konfigurace KPI definic používaných při benchmarkových experimentech.
#
# @author Vojtěch Hubáček
#
# @par Autorský podíl
# - Vojtěch Hubáček: návrh a implementace celé funkcionality souboru.
#
# @ingroup riot_testing

kpis:
  - id: "K1"
    label: "WAZE congestion high"
    source: "waze"
    mode: "ALL"
    complexity: "simple"
    selected_instance_labels: []
    definition:
      nodes:
        - node_id: "root"
          node_type: "NUMERIC_GEQ"
          parameter_denotation: "level"
          numeric_reference_value: 3

  - id: "K2"
    label: "WAZE selected severe congestion"
    source: "waze"
    mode: "SELECTED"
    complexity: "medium"
    selected_instance_labels: ["WAZE_JAM_1_FWD", "WAZE_JAM_2_REV", "WAZE_JAM_3_FWD"]
    definition:
      nodes:
        - node_id: "root"
          node_type: "AND"
        - node_id: "n1"
          parent_node_id: "root"
          node_type: "NUMERIC_GEQ"
          parameter_denotation: "level"
          numeric_reference_value: 4
        - node_id: "n2"
          parent_node_id: "root"
          node_type: "NUMERIC_LT"
          parameter_denotation: "speed"
          numeric_reference_value: 20

  - id: "K3"
    label: "NDIC low speed"
    source: "ndic"
    mode: "ALL"
    complexity: "simple"
    selected_instance_labels: []
    definition:
      nodes:
        - node_id: "root"
          node_type: "NUMERIC_LT"
          parameter_denotation: "trafficSpeedAnyVehicle"
          numeric_reference_value: 25

  - id: "K4"
    label: "NDIC selected long travel time"
    source: "ndic"
    mode: "SELECTED"
    complexity: "medium"
    selected_instance_labels: ["NDIC_TRAFFIC_SRC-00003"]
    definition:
      nodes:
        - node_id: "root"
          node_type: "AND"
        - node_id: "n1"
          parent_node_id: "root"
          node_type: "NUMERIC_GT"
          parameter_denotation: "travelTimeAnyVehicle"
          numeric_reference_value: 180
        - node_id: "n2"
          parent_node_id: "root"
          node_type: "NUMERIC_GEQ"
          parameter_denotation: "trafficLevelAnyVehicle"
          numeric_reference_value: 3

  - id: "K4B"
    label: "NDIC selected many slow segments"
    source: "ndic"
    mode: "SELECTED"
    complexity: "medium"
    selected_instance_labels:
      - "NDIC_TRAFFIC_SRC-00001"
      - "NDIC_TRAFFIC_SRC-00002"
      - "NDIC_TRAFFIC_SRC-00003"
      - "NDIC_TRAFFIC_SRC-00004"
      - "NDIC_TRAFFIC_SRC-00005"
      - "NDIC_TRAFFIC_SRC-00006"
      - "NDIC_TRAFFIC_SRC-00007"
      - "NDIC_TRAFFIC_SRC-00008"
      - "NDIC_TRAFFIC_SRC-00009"
      - "NDIC_TRAFFIC_SRC-00010"
      - "NDIC_TRAFFIC_SRC-00011"
    definition:
      nodes:
        - node_id: "root"
          node_type: "AND"
        - node_id: "n1"
          parent_node_id: "root"
          node_type: "NUMERIC_LT"
          parameter_denotation: "trafficSpeedAnyVehicle"
          numeric_reference_value: 30
        - node_id: "n2"
          parent_node_id: "root"
          node_type: "NUMERIC_GT"
          parameter_denotation: "travelTimeAnyVehicle"
          numeric_reference_value: 120

  - id: "K5"
    label: "MHD delayed trip"
    source: "mhd"
    mode: "ALL"
    complexity: "simple"
    selected_instance_labels: []
    definition:
      nodes:
        - node_id: "root"
          node_type: "NUMERIC_GT"
          parameter_denotation: "delay"
          numeric_reference_value: 120

  - id: "K6"
    label: "MHD selected delayed and slow"
    source: "mhd"
    mode: "SELECTED"
    complexity: "medium"
    selected_instance_labels:
      - "MHD_TRIP_00001"
      - "MHD_TRIP_00002"
      - "MHD_TRIP_00003"
      - "MHD_TRIP_00004"
      - "MHD_TRIP_00005"
    definition:
      nodes:
        - node_id: "root"
          node_type: "AND"
        - node_id: "n1"
          parent_node_id: "root"
          node_type: "NUMERIC_GT"
          parameter_denotation: "delay"
          numeric_reference_value: 180
        - node_id: "n2"
          parent_node_id: "root"
          node_type: "BOOLEAN_EQ"
          parameter_denotation: "isinactive"
          boolean_reference_value: false

extended_kpis:
  - id: "KX1"
    label: "WAZE extra KPI"
    source: "waze"
    mode: "ALL"
    complexity: "simple"
    selected_instance_labels: []
    definition:
      nodes:
        - node_id: "root"
          node_type: "NUMERIC_GT"
          parameter_denotation: "delay"
          numeric_reference_value: 60

  - id: "KX2"
    label: "NDIC extra KPI"
    source: "ndic"
    mode: "ALL"
    complexity: "simple"
    selected_instance_labels: []
    definition:
      nodes:
        - node_id: "root"
          node_type: "NUMERIC_GEQ"
          parameter_denotation: "trafficLevelAnyVehicle"
          numeric_reference_value: 4

  - id: "KX3"
    label: "MHD extra KPI"
    source: "mhd"
    mode: "ALL"
    complexity: "simple"
    selected_instance_labels: []
    definition:
      nodes:
        - node_id: "root"
          node_type: "NUMERIC_GEQ"
          parameter_denotation: "bearing"
          numeric_reference_value: 180
