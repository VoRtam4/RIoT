## @file docker-compose.yml
#  @brief Lokální Docker Compose sestava platformy RIoT.
#
#  @author Michal Bureš
#  @author Vojtěch Hubáček
#
#  @par Autorský podíl
#  - Michal Bureš: původní Docker Compose sestava základních služeb platformy RIoT.
#  - Vojtěch Hubáček: doplnění Time Series Store, InfluxDB napojení a provozních proměnných jako DEV_ENV a worker konfigurace.
#
#  @defgroup riot RIoT
#  @see README.md

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      DEV_ENV: ${DEV_ENV}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
    depends_on:
        - backend-core
    ports:
        - "8080:80"

  backend-core:
    build:
      context: ./backend
      dockerfile: backend-core/Dockerfile
    restart: unless-stopped
    environment:
      DEV_ENV: ${DEV_ENV}
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
      INFLUX_URL: ${INFLUX_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORGANIZATION}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL}
      GOOGLE_OAUTH2_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
      GOOGLE_OAUTH2_CLIENT_SECRET: ${GOOGLE_OAUTH2_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS} # Essentially a API client whitelist TODO: Configure this as needed...
      # SECURE_COOKIES: "" # Comment this out if you are using http instead of https
      JWT_AUTHENTICATION_MIDDLEWARE_ENABLED: "" # Set to false only for explicit local unauthenticated API access
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      influxdb:
        condition: service_started
    ports:
      - "9090:9090"
    #cpu_quota: 1000 # 1% of a single CPU core
    #mem_limit: 32m # 32 MB of RAM

  message-processing-unit:
    build:
      context: ./backend
      dockerfile: message-processing-unit/Dockerfile
    restart: unless-stopped
    environment:
      DEV_ENV: ${DEV_ENV}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MPU_INPUT_WORKERS: ${MPU_INPUT_WORKERS:-1}
      MPU_INTERNAL_INPUT_BUFFER: ${MPU_INTERNAL_INPUT_BUFFER:-1000}
      MPU_INPUT_PAUSE_HIGH_WATERMARK_PERCENT: ${MPU_INPUT_PAUSE_HIGH_WATERMARK_PERCENT:-80}
      MPU_INPUT_RESUME_LOW_WATERMARK_PERCENT: ${MPU_INPUT_RESUME_LOW_WATERMARK_PERCENT:-50}
      MPU_INPUT_SOURCE_PAUSE_HIGH_WATERMARK_PERCENT: ${MPU_INPUT_SOURCE_PAUSE_HIGH_WATERMARK_PERCENT:-50}
      MPU_INPUT_SOURCE_RESUME_LOW_WATERMARK_PERCENT: ${MPU_INPUT_SOURCE_RESUME_LOW_WATERMARK_PERCENT:-25}
      MPU_INPUT_PAUSE_CHECK_INTERVAL_MS: ${MPU_INPUT_PAUSE_CHECK_INTERVAL_MS:-200}
      MPU_INPUT_TREND_SAMPLE_INTERVAL_MS: ${MPU_INPUT_TREND_SAMPLE_INTERVAL_MS:-5000}
      MPU_INPUT_WATCH_PRESSURE_THRESHOLD: ${MPU_INPUT_WATCH_PRESSURE_THRESHOLD:-0.1}
      MPU_INPUT_DROP_CANDIDATE_PRESSURE_THRESHOLD: ${MPU_INPUT_DROP_CANDIDATE_PRESSURE_THRESHOLD:-0.5}
      MPU_INPUT_DROP_CANDIDATE_BACKLOG_DELTA_THRESHOLD: ${MPU_INPUT_DROP_CANDIDATE_BACKLOG_DELTA_THRESHOLD:-1}
      MPU_INPUT_STATE_ESCALATION_SAMPLES: ${MPU_INPUT_STATE_ESCALATION_SAMPLES:-3}
      MPU_INPUT_STATE_RECOVERY_SAMPLES: ${MPU_INPUT_STATE_RECOVERY_SAMPLES:-3}
      MPU_INPUT_DROPPER_ENABLED: ${MPU_INPUT_DROPPER_ENABLED:-false}
      MPU_INPUT_DROPPER_GRACE_SAMPLES: ${MPU_INPUT_DROPPER_GRACE_SAMPLES:-3}
      MPU_REPROCESS_WORKERS: ${REPROCESS_WORKERS:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend-core:
        condition: service_started # 'Backend-core' has to set up the 'RabbitMQ infrastructure'
    #cpu_quota: 1000 # 1% of a single CPU core
    #mem_limit: 32m # 32 MB of RAM

  mosquitto:
    image: eclipse-mosquitto:latest
    profiles: ["dev"]
    ports:
      - "9001:9001"
      - "1883:1883"
    volumes:
        - ./config/mosquitto-config:/mosquitto/config
        - ./docker/mosquitto-data:/mosquitto/data
        - ./docker/mosquitto-log:/mosquitto/log

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - ${RIOT_DOCKER_DATA_DIR:-./docker}/postgres-data:/var/lib/postgresql/data
      - ${RIOT_DOCKER_DATA_DIR:-./docker}/pg_backup:/backup

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com # Not a real e-mail address...
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "8081:80"

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORGANIZATION}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - ${RIOT_DOCKER_DATA_DIR:-./docker}/influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: [ "CMD", "influx", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  time-series-store:
    build:
      context: ./backend
      dockerfile: time-series-store/Dockerfile
    restart: unless-stopped
    environment:
      DEV_ENV: ${DEV_ENV}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INFLUX_ORGANIZATION: ${INFLUX_ORGANIZATION}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_READ_WORKERS: ${INFLUX_READ_WORKERS:-1}
      INFLUX_REPROCESS_WORKERS: ${REPROCESS_WORKERS:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend-core:
        condition: service_started # 'Backend-core' has to set up the 'RabbitMQ infrastructure'

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: "my_shared_cookie"
    volumes:
      - ${RIOT_DOCKER_DATA_DIR:-./docker}/rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-enterprise
    profiles: ["dev"]
    volumes:
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: password

  prometheus:
    image: prom/prometheus
    profiles: ["dev"]
    volumes:
      - "./config/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9091:9090"

  mqtt-prometheus-exporter:
    profiles: ["dev"]
    image: kpetrem/mqtt-exporter
    ports:
      - "9000:9000"
    environment:
      MQTT_ADDRESS: mosquitto
      MQTT_TOPIC: topic
      MQTT_USERNAME: admin
      MQTT_PASSWORD: password
