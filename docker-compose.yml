##/
 # @File: docker-compose.yml
 # @Author: Dominik Vondruška
 # @Project: Bakalářská práce — Systém pro monitorování otevřených dat v reálném čase
 # @Description: Soubor byl převzat z původního systému RIOT a doplněn o nové služby a upraven. 
##/

version: '3'

services:
  riot-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
    depends_on:
        - riot-backend-core
    ports:
        - "8080:80"

  riot-backend-core:
    build:
      context: ./backend
      dockerfile: backend-core/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
      INFLUX_URL: ${INFLUX_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORGANIZATION}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL}
      GOOGLE_OAUTH2_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
      GOOGLE_OAUTH2_CLIENT_SECRET: ${GOOGLE_OAUTH2_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS} # Essentially a API client whitelist TODO: Configure this as needed...
      # SECURE_COOKIES: "" # Comment this out if you are using http instead of https
      JWT_AUTHENTICATION_MIDDLEWARE_ENABLED: "" # Comment this out if you need unrestricted API access without authentication
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      influxdb:
        condition: service_started
    ports:
      - "9090:9090"
    #cpu_quota: 1000 # 1% of a single CPU core
    #mem_limit: 32m # 32 MB of RAM

  riot-message-processing-unit:
    build:
      context: ./backend
      dockerfile: message-processing-unit/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      riot-backend-core:
        condition: service_started # 'Backend-core' has to set up the 'RabbitMQ infrastructure'
    #cpu_quota: 1000 # 1% of a single CPU core
    #mem_limit: 32m # 32 MB of RAM

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "9001:9001"
      - "1883:1883"
    volumes:
        - ./config/mosquitto-config:/mosquitto/config
        - ./config/mosquitto-data:/mosquitto/data
        - ./docker/mosquitto-log:/mosquitto/log

  postgres:
    image: postgres:16
    environment:
      APP_ENV: ${APP_ENV}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_backup:/backup

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com # Not a real e-mail address...
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "8081:80"

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - APP_ENV=${APP_ENV}
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORGANIZATION}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - ./docker/influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: [ "CMD", "influx", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  riot-time-series-store:
    build:
      context: ./backend
      dockerfile: time-series-store/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INFLUX_ORGANIZATION: ${INFLUX_ORGANIZATION}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      riot-backend-core:
        condition: service_started # 'Backend-core' has to set up the 'RabbitMQ infrastructure'

  rabbitmq:
    image: rabbitmq:3-management
    container_name: riot-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15692:15692"  # Prometheus (nepovinné)
    environment:
      APP_ENV: ${APP_ENV}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: "my_shared_cookie"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-enterprise
    profiles: ["dev"]
    volumes:
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      APP_ENV: ${APP_ENV}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: password

  prometheus:
    image: prom/prometheus
    profiles: ["dev"]
    volumes:
      - "./config/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9091:9090"

  mqtt-prometheus-exporter:
    profiles: ["dev"]
    image: kpetrem/mqtt-exporter
    ports:
      - "9000:9000"
    environment:
      APP_ENV: ${APP_ENV}
      MQTT_ADDRESS: mosquitto
      MQTT_TOPIC: topic
      MQTT_USERNAME: admin
      MQTT_PASSWORD: password

volumes:
  rabbitmq_data:
  postgres_data:

