##/
 # @File: docker-compose.yml
 # @Author: Dominik Vondruška
 # @Project: Bakalářská práce — Systém pro monitorování otevřených dat v reálném čase
 # @Description: Soubor byl převzat z původního systému RIOT a doplněn o nové služby a upraven. 
##/

version: '3'

services:
  riot-backend-core:
    build:
      context: ./backend
      dockerfile: backend-core/Dockerfile
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}
      INFLUXDB_URL: http://influxdb:8086
      RABBITMQ_URL: ${RABBITMQ_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    depends_on:
      - rabbitmq
      - postgres
      - influxdb
    ports:
      - "9090:9090"
    #cpu_quota: 1000 # 1% of a single CPU core
    #mem_limit: 32m # 32 MB of RAM

  riot-message-processing-unit:
    build:
      context: ./backend
      dockerfile: message-processing-unit/Dockerfile
    environment:
      BACKEND_CORE_URL: ${BACKEND_CORE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      - rabbitmq
      - riot-backend-core # 'Backend-core' has to set up the 'RabbitMQ infrastructure'
    #cpu_quota: 1000 # 1% of a single CPU core
    #mem_limit: 32m # 32 MB of RAM

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "9001:9001"
      - "1883:1883"
    volumes:
        - ./docker/mosquitto-config:/mosquitto/config
        - ./docker/mosquitto-data:/mosquitto/data
        - ./docker/mosquitto-log:/mosquitto/log

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
      - ./pg_backup:/backup

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com # Not a real e-mail address...
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "8081:80"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: riot-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15692:15692"  # Prometheus (nepovinné)
    environment:
      RABBITMQ_DEFAULT_USER: riot
      RABBITMQ_DEFAULT_PASS: secret
      RABBITMQ_ERLANG_COOKIE: "my_shared_cookie"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-enterprise
    volumes:
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: password

  prometheus:
    image: prom/prometheus
    volumes:
      - "./docker/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9091:9090"

  mqtt-prometheus-exporter:
    image: kpetrem/mqtt-exporter
    ports:
      - "9000:9000"
    environment:
      MQTT_ADDRESS: mosquitto
      MQTT_TOPIC: topic
      MQTT_USERNAME: admin
      MQTT_PASSWORD: password

  influxdb:
    image: influxdb:2.7
    container_name: riot-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  rabbitmq_data:
  influxdb_data:
