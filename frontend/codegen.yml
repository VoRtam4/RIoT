overwrite: true
schema: "http://localhost:9090/graphql"
documents: "src/**/*.{ts,tsx,graphql}"

generates:
  src/generated/:
    preset: "client"
    plugins: []
    config:
      enumsAsTypes: true
      useTypeImports: true
      skipTypename: false
      avoidOptionals: false

  ./graphql.schema.json:
    plugins:
      - introspection