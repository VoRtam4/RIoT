# @file apíKeys.graphql
# @brief GraphQL operace pro správu API klíčů, oprávnění a IP restrikcí.
#
# @author Vojtěch Hubáček
#
# @par Autorský podíl
# - Vojtěch Hubáček: návrh a implementace celé funkcionality souboru.
#
# @ingroup riot_frontend

query ApiKeys {
  apiKeys {
    uid
    label
    revoked
    expiresAt
    permissions
    ipRestrictions
  }
}

mutation CreateApiKey($input: APIKeyInput!) {
  createAPIKey(input: $input)
}

mutation UpdateApiKey($uid: String!, $input: APIKeyInput!) {
  updateAPIKey(uid: $uid, input: $input)
}

mutation DeleteApiKey($uid: String!) {
  deleteAPIKey(uid: $uid)
}
