# @file sdTypes.graphql
# @brief GraphQL dotazy pro načítání sledovaných typů a jejich parametrů.
#
# @author Vojtěch Hubáček
#
# @par Autorský podíl
# - Vojtěch Hubáček: návrh a implementace celé funkcionality souboru.
#
# @ingroup riot_frontend

query SdTypes {
  sdTypes {
    id
    uid
    label
    parameters {
      id
      label
      denotation
      type
      role
    }
  }
}

query SdTypeById($id: ID!) {
  sdType(id: $id) {
    id
    uid
    label
    parameters {
      id
      label
      denotation
      type
      role
    }
  }
}
